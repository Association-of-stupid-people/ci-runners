# Runner scale set `bibg-light`: general jobs, up to two at once.
# Every pod is fresh (own Docker daemon, empty data dir); only the npm cache is shared on the host.
# Install/upgrade with install.sh on the runner host.
githubConfigSecret: arc-github
runnerScaleSetName: bibg-light
minRunners: 0
maxRunners: 2

template:
  spec:
    initContainers:
      - name: init-dind-externals
        image: ghcr.io/actions/actions-runner:latest
        command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
      - name: dind
        image: docker:29-dind
        restartPolicy: Always
        # Pod network (flannel) has MTU 1450; Docker's bridges default to 1500, so large packets from job
        # containers (e.g. git fetch) are dropped and connections reset. Match the pod MTU on every network.
        args: ["dockerd", "--host=unix:///var/run/docker.sock", "--group=123", "--mtu=1450",
               "--default-network-opt=bridge=com.docker.network.driver.mtu=1450"]
        securityContext:
          privileged: true
        resources:
          requests: { cpu: 250m, memory: 512Mi }
          limits: { cpu: "3", memory: 2560Mi }
        startupProbe:
          exec:
            command: ["docker", "info"]
          failureThreshold: 24
          periodSeconds: 5
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
          - name: docker-data
            mountPath: /var/lib/docker
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
        resources:
          requests: { cpu: 250m, memory: 512Mi }
          limits: { cpu: "3", memory: 3Gi }
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: npm-cache
            mountPath: /home/runner/.npm
    volumes:
      - name: work
        emptyDir: {}
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
      - name: docker-data
        emptyDir: {}
      - name: npm-cache
        hostPath:
          path: /var/lib/bibg-ci/npm-cache
          type: Directory
